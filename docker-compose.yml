# ============================================================================
#  Projet Sécurité — Honeypot (Cowrie) + NIDS (Scapy) + Pentest + Analyse
# ============================================================================
#  Architecture :
#    - honeypot   : Cowrie, expose SSH (2222) et Telnet (2223) ;
#    - nids       : partage la pile réseau du honeypot pour sniffer TOUT le
#                   trafic qui lui est destiné (network_mode: service:honeypot) ;
#    - metasploit : démon msfrpcd piloté par le pentest (API RPC) ;
#    - pentest    : conteneur d'attaque, sur le même réseau, cible "honeypot" ;
#    - analysis   : conteneur d'analyse des logs Cowrie (pandas + matplotlib).
#
#  Démarrage (voir aussi scripts/demo.sh qui enchaîne toutes les étapes) :
#    docker compose up -d honeypot nids            # cible + sonde
#    docker compose --profile attaque up -d metasploit   # démon Metasploit
#    docker compose run --rm pentest               # lance les attaques
#    docker compose stop nids                      # -> génère le rapport chiffré
#    docker compose run --rm analysis              # analyse des logs du honeypot
# ============================================================================

services:

  # -------------------------------------------------------------------- #
  #  HONEYPOT — Cowrie (SSH/Telnet à faible/moyenne interaction)
  # -------------------------------------------------------------------- #
  honeypot:
    image: cowrie/cowrie:latest
    container_name: cowrie_honeypot
    restart: unless-stopped
    ports:
      - "2222:2222"     # SSH leurre
      - "2223:2223"     # Telnet leurre
    volumes:
      # Persistance des logs JSON (lus par l'analyse).
      - ./data/cowrie/log:/cowrie/cowrie-git/var/log/cowrie
      - ./data/cowrie/dl:/cowrie/cowrie-git/var/lib/cowrie/downloads
      # Identifiants faibles acceptés (voir honeypot/userdb.txt).
      - ./honeypot/userdb.txt:/cowrie/cowrie-git/etc/userdb.txt:ro
    networks:
      - honeynet

  # -------------------------------------------------------------------- #
  #  NIDS — sonde de détection d'intrusion (Scapy)
  # -------------------------------------------------------------------- #
  nids:
    build: ./nids
    container_name: nids
    restart: unless-stopped
    # Partage la pile réseau du honeypot : le NIDS voit exactement le même
    # trafic (interface eth0 du honeypot). Impose de NE PAS définir ports/
    # networks ici (ils sont hérités du honeypot).
    network_mode: "service:honeypot"
    cap_add:
      - NET_ADMIN       # requis par Scapy pour capturer en mode promiscuité
      - NET_RAW
    environment:
      - NIDS_IFACE=eth0
      - NIDS_DATA_DIR=/app/data
      # Seuils (ajustables sans rebuild).
      - NIDS_SCAN_THRESHOLD=15
      - NIDS_DOS_THRESHOLD=200
      - NIDS_BRUTE_THRESHOLD=10
      # Envoi du rapport chiffré (renseigner le .env).
      - SMTP_HOST=${SMTP_HOST:-smtp.gmail.com}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - REPORT_SENDER=${REPORT_SENDER:-}
      - REPORT_RECEIVER=${REPORT_RECEIVER:-}
      - NIDS_FERNET_KEY=${NIDS_FERNET_KEY:-}
    volumes:
      - ./data/nids:/app/data
    depends_on:
      - honeypot
    # Laisse le temps à Scapy de flusher + envoyer le rapport sur docker stop.
    stop_grace_period: 30s

  # -------------------------------------------------------------------- #
  #  METASPLOIT — démon RPC (msfrpcd) piloté par le pentest via pymetasploit3
  # -------------------------------------------------------------------- #
  metasploit:
    image: metasploitframework/metasploit-framework:latest
    container_name: metasploit
    # Lance le démon RPC en clair (-S = SSL désactivé), accessible sur le
    # réseau honeynet au port 55553. `-f` : reste au premier plan (conteneur).
    entrypoint: ""
    command: ./msfrpcd -U msf -P epita_nid -S -a 0.0.0.0 -f
    volumes:
      # Même dossier que le pentest, monté au même chemin : msfrpcd lit les
      # dictionnaires (msf_users.txt / msf_pass.txt) écrits par le pentest.
      - ./data/pentest:/app/data
    networks:
      - honeynet
    depends_on:
      - honeypot
    # Démon d'attaque : démarré uniquement avec le profil "attaque".
    profiles:
      - attaque

  # -------------------------------------------------------------------- #
  #  PENTEST — conteneur d'attaque (à lancer à la demande)
  # -------------------------------------------------------------------- #
  pentest:
    build: ./pentest
    container_name: pentest
    environment:
      - TARGET_HOST=honeypot      # résout vers le conteneur Cowrie
      - SSH_PORT=2222
      - TELNET_PORT=2223
      # Écrit pentest_results.json à la racine du volume monté.
      - PENTEST_DATA_DIR=/app/data
      # Pilotage de Metasploit via l'API RPC (conteneur "metasploit").
      - MSF_RPC_HOST=metasploit
      - MSF_RPC_PORT=55553
      - MSF_RPC_USER=msf
      - MSF_RPC_PASSWORD=epita_nid
      - MSF_RPC_SSL=false
    cap_add:
      - NET_RAW                   # pour le scan SYN Scapy (optionnel)
    volumes:
      - ./data/pentest:/app/data
    networks:
      - honeynet
    depends_on:
      - honeypot
      - metasploit
    # Ne tourne pas en service permanent : `docker compose run --rm pentest`.
    profiles:
      - attaque

  # -------------------------------------------------------------------- #
  #  ANALYSIS — analyse des logs du honeypot (à lancer à la demande)
  # -------------------------------------------------------------------- #
  analysis:
    build: ./analysis
    container_name: analysis
    environment:
      - MPLBACKEND=Agg          # génération PNG sans serveur graphique
    volumes:
      - ./data:/data            # lit cowrie.json, écrit data/analysis/
    profiles:
      - analyse

networks:
  honeynet:
    driver: bridge
