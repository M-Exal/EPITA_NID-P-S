# ============================================================================
#  Architecture Sécurité : Cible (Metasploitable 2) + NIDS / NIPS + Pentest
# ============================================================================

services:

  # -------------------------------------------------------------------- #
  #  1. HONEYPOT / CIBLE VULNÉRABLE — Metasploitable 2
  # -------------------------------------------------------------------- #
  metasploitable:
    image: tleemcjr/metasploitable2:latest
    container_name: metasploitable2
    restart: unless-stopped
    stdin_open: true
    tty: true
    command: sh -c "/bin/services.sh && tail -f /dev/null"
    ports:
      - "2222:22"     # SSH
      - "2223:23"     # Telnet
      - "8080:80"     # HTTP (Apache / DVWA / Mutillidae)
      - "2121:21"     # FTP (vsftpd)
    networks:
      - honeynet

  # -------------------------------------------------------------------- #
  #  2. NIDS / NIPS — Détection & Prévention (Scapy + iptables)
  # -------------------------------------------------------------------- #
  nids:
    build: ./nids
    container_name: nids_service
    restart: unless-stopped
    # Partage la pile réseau de la cible pour inspecter et bloquer le trafic
    network_mode: "service:metasploitable"
    cap_add:
      - NET_ADMIN
      - NET_RAW
    environment:
      - NIDS_IFACE=eth0
      - NIDS_DATA_DIR=/app/data
      # Mode démo par défaut (false) : permet d'observer les 7 attaques du pentest.
      # En mode production : NIPS_ENABLED=true (blocage actif iptables DROP).
      - NIPS_ENABLED=${NIPS_ENABLED:-false}
      - NIDS_SCAN_THRESHOLD=15
      - NIDS_DOS_THRESHOLD=200
      - NIDS_BRUTE_THRESHOLD=10
      - SMTP_HOST=${SMTP_HOST:-smtp.gmail.com}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - REPORT_SENDER=${REPORT_SENDER:-}
      - REPORT_RECEIVER=${REPORT_RECEIVER:-}
      - NIDS_FERNET_KEY=${NIDS_FERNET_KEY:-}
      - DISCORD_WEBHOOK_URL=${DISCORD_WEBHOOK_URL:-}
    volumes:
      - ./data/nids:/app/data
      - ./nids:/app
    depends_on:
      - metasploitable
    stop_grace_period: 20s

  # -------------------------------------------------------------------- #
  #  3. PENTEST — Conteneur d'attaque à la demande
  # -------------------------------------------------------------------- #
  pentest:
    build: ./pentest
    container_name: pentest_runner
    environment:
      - TARGET_HOST=metasploitable
      - SSH_PORT=22
      - TELNET_PORT=23
      - HTTP_PORT=80
      - FTP_PORT=21
    cap_add:
      - NET_RAW
    volumes:
      - ./data/pentest:/app/data
      - ./pentest:/app
    networks:
      - honeynet
    depends_on:
      - metasploitable
    profiles:
      - attaque

  # -------------------------------------------------------------------- #
  #  4. SIEM DASHBOARD — Supervision web en temps réel
  # -------------------------------------------------------------------- #
  dashboard:
    build: ./dashboard
    container_name: siem_dashboard
    restart: unless-stopped
    ports:
      - "5050:5050"
    cap_add:
      - NET_RAW
    environment:
      - NIDS_ALERT_JSON=/app/data/nids_alerts.json
      - PORT=5050
      - TARGET_HOST=metasploitable
      - SSH_PORT=22
      - TELNET_PORT=23
      - HTTP_PORT=80
      - FTP_PORT=21
    volumes:
      - ./data/nids:/app/data:ro
      - ./dashboard:/app
      - ./scripts:/app/scripts
      - ./pentest:/app/pentest
    networks:
      - honeynet
    depends_on:
      - nids


networks:
  honeynet:
    driver: bridge
