<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CyBear — Terminal SSH</title>
    <meta name="theme-color" content="#a3e635">
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='img/favicon.svg') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.css" />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/theme.css') }}">
    <style>
        :root {
            --bg: #ffffff;
            --bg-card: #ffffff;
            --border: #000000;
            --text: #000000;
            --text-muted: #4b5563;
            --main: #a3e635;
            --main-hover: #84cc16;
            --critique: #ef4444;
            --critique-bg: #fee2e2;
            --succes: #10b981;
            --succes-bg: #d1fae5;
            --accent: #2563eb;
            --terminal-bg: #050510;
            --shadow: 4px 4px 0px #000000;
            --shadow-sm: 2px 2px 0px #000000;
            --grid: rgba(0, 0, 0, 0.08);
        }

        [data-theme="dark"] {
            --bg: #090a10;
            --bg-alt: #10121a;
            --bg-card: #131520;
            --border: #262938;
            --border-highlight: #3c4159;
            --text: #f1f5f9;
            --text-muted: #94a3b8;
            --main: #a3e635;
            --main-hover: #bef264;
            --critique: #f87171;
            --critique-bg: rgba(239, 68, 68, 0.18);
            --succes: #34d399;
            --succes-bg: rgba(16, 185, 129, 0.18);
            --accent: #60a5fa;
            --terminal-bg: #000000;
            --shadow: 4px 4px 0px #000000;
            --shadow-sm: 2px 2px 0px #000000;
            --grid: rgba(255, 255, 255, 0.035);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            background-image: 
                linear-gradient(to right, var(--grid) 1px, transparent 1px),
                linear-gradient(to bottom, var(--grid) 1px, transparent 1px);
            background-size: 40px 40px;
            color: var(--text);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 18px;
            transition: background 0.2s ease, color 0.2s ease;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 22px;
            background: var(--bg-card);
            border: 2px solid var(--border);
            border-radius: 8px;
            box-shadow: var(--shadow);
            flex-wrap: wrap;
            gap: 12px;
        }

        .header-brand {
            display: flex;
            align-items: center;
            gap: 14px;
            flex-wrap: wrap;
        }

        .brand-title {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1.6rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand-logo {
            display: flex;
            flex-direction: column;
            background: var(--main);
            color: #000000;
            padding: 6px 12px;
            border: 2px solid var(--border);
            border-radius: 6px;
            box-shadow: var(--shadow-sm);
            line-height: 0.9;
        }

        .brand-logo span {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1.15rem;
            font-weight: 800;
        }

        .brand-tag {
            font-size: 0.75rem;
            background: var(--main);
            color: #000000;
            padding: 4px 12px;
            border: 2px solid var(--border);
            border-radius: 6px;
            font-weight: 800;
            text-transform: uppercase;
            box-shadow: var(--shadow-sm);
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            border-radius: 6px;
            border: 2px solid var(--border);
            background: var(--bg-card);
            color: var(--text);
            font-weight: 800;
            font-size: 0.85rem;
            text-decoration: none;
            cursor: pointer;
            box-shadow: var(--shadow-sm);
            transition: transform 0.1s ease, box-shadow 0.1s ease;
        }

        .btn:hover {
            transform: translate(-2px, -2px);
            box-shadow: var(--shadow);
        }

        .btn:active {
            transform: translate(0px, 0px);
            box-shadow: 0px 0px 0px;
        }

        .btn-lime {
            background: var(--main);
            color: #000000;
        }

        .panel {
            background: var(--bg-card);
            border: 2px solid var(--border);
            border-radius: 8px;
            box-shadow: var(--shadow);
            display: flex;
            flex-direction: column;
            flex: 1;
            min-height: 620px;
            overflow: hidden;
        }

        .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 18px;
            background: #000000;
            border-bottom: 2px solid var(--border);
            color: #ffffff;
        }

        .panel-title {
            display: flex;
            align-items: center;
            gap: 12px;
            font-family: 'JetBrains Mono', ui-monospace, monospace;
            font-size: 0.85rem;
            font-weight: 700;
            color: #ffffff;
        }

        .dots {
            display: flex;
            gap: 6px;
        }

        .dot {
            width: 11px;
            height: 11px;
            border-radius: 50%;
            border: 1px solid rgba(255, 255, 255, 0.4);
        }

        .dot-red { background: #ef4444; }
        .dot-yellow { background: #f59e0b; }
        .dot-green { background: #10b981; }

        #terminal-container {
            flex: 1;
            background: var(--terminal-bg);
            padding: 14px 16px 8px 16px;
            overflow: hidden;
        }

        #terminal {
            height: 100%;
            width: 100%;
        }

        /* ── Règle absolue pour xterm : neutraliser Inter, forcer police monospace système stricte ── */
        #terminal,
        #terminal * {
            font-family: Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace !important;
            letter-spacing: 0px !important;
            word-spacing: normal !important;
            font-variant-ligatures: none !important;
            font-feature-settings: "liga" 0, "calt" 0 !important;
            text-rendering: optimizeSpeed !important;
            -webkit-font-smoothing: antialiased;
        }

        .xterm {
            height: 100% !important;
            padding: 0 !important;
        }

        .xterm-viewport {
            background-color: var(--terminal-bg) !important;
        }

        .xterm-screen {
            font-variant-ligatures: none !important;
        }

        .status-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 18px;
            background: #000000;
            border-top: 2px solid var(--border);
            font-size: 0.82rem;
            font-weight: 700;
            color: #ffffff;
            font-family: 'JetBrains Mono', ui-monospace, monospace;
        }

        .status-left {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .status-dot {
            width: 9px;
            height: 9px;
            border-radius: 50%;
            background: #f59e0b;
            border: 1px solid var(--border);
        }

        .status-dot.connected {
            background: var(--main);
            box-shadow: 0 0 8px var(--main);
        }

        .status-dot.error {
            background: #ef4444;
        }

        footer {
            text-align: center;
            color: var(--text-muted);
            font-size: 0.85rem;
            font-weight: 700;
        }
    </style>
</head>
<body>
    <header>
        <div class="header-brand">
            <div class="brand-title">
                <div class="brand-logo">
                    <span>CYBEAR</span>
                    <span>TERM</span>
                </div>
                Terminal SSH Interactif
            </div>
            <span class="brand-tag">Accès Cible Sécurisé</span>
        </div>
        <div class="header-actions">
            <a href="/" class="btn">SIEM Supervision</a>
            <a href="/attaques" class="btn btn-lime">Panneau d'Attaques</a>
            <button class="btn" id="theme-toggle">Thème</button>
        </div>
    </header>

    <section class="panel">
        <div class="panel-header">
            <div class="panel-title">
                <div class="dots">
                    <span class="dot dot-red" onclick="window.close()" style="cursor:pointer;" title="Fermer"></span>
                    <span class="dot dot-yellow"></span>
                    <span class="dot dot-green"></span>
                </div>
                <span id="session-title">Initialisation de la session…</span>
            </div>
            <span style="color: var(--main); font-size: 0.8rem; font-family: 'JetBrains Mono', monospace; font-weight: 700;">xterm.js • VT100</span>
        </div>
        <div id="terminal-container">
            <div id="terminal"></div>
        </div>
        <div class="status-bar">
            <div class="status-left">
                <span class="status-dot" id="status-dot"></span>
                <span id="status-text">Connexion en cours…</span>
            </div>
            <div>CyBear SIEM • Neobrutal Interface</div>
        </div>
    </section>

    <footer>CyBear SIEM & Pentest — Neobrutal Design System</footer>

    <script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit@0.8.0/lib/xterm-addon-fit.js"></script>
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    <script>
        // ── Thème nadanada ──
        const themeToggle = document.getElementById('theme-toggle');
        const root = document.documentElement;
        const savedTheme = localStorage.getItem('cybear-theme') || 'dark';
        root.setAttribute('data-theme', savedTheme);
        themeToggle.textContent = savedTheme === 'dark' ? 'Mode clair' : 'Mode sombre';
        themeToggle.addEventListener('click', () => {
            const current = root.getAttribute('data-theme');
            const next = current === 'dark' ? 'light' : 'dark';
            root.setAttribute('data-theme', next);
            localStorage.setItem('cybear-theme', next);
            themeToggle.textContent = next === 'dark' ? 'Mode clair' : 'Mode sombre';
        });

        // ── Paramètres URL ──
        const params = new URLSearchParams(window.location.search);
        const token = params.get("token") || "";
        const label = params.get("label") || "SSH Terminal";
        const sessionTitle = document.getElementById('session-title');
        if (label) sessionTitle.textContent = decodeURIComponent(label);

        const statusDot = document.getElementById('status-dot');
        const statusText = document.getElementById('status-text');

        // ── Terminal xterm.js : résolution stricte de la police pour éviter tout glitch de chasse fixe ──
        const term = new Terminal({
            cursorBlink: true,
            scrollback: 10000,
            fontFamily: 'Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace',
            fontSize: 14,
            lineHeight: 1.2,
            letterSpacing: 0,
            allowTransparency: false,
            theme: {
                background: "#000000",
                foreground: "#22c55e",
                cursor: "#a3e635",
                cursorAccent: "#000000",
                selectionBackground: "rgba(163, 230, 53, 0.3)",
                black: "#1e293b",
                brightBlack: "#475569",
                red: "#f87171",
                brightRed: "#fca5a5",
                green: "#22c55e",
                brightGreen: "#86efac",
                yellow: "#fbbf24",
                brightYellow: "#fde047",
                blue: "#60a5fa",
                brightBlue: "#93c5fd",
                magenta: "#c084fc",
                brightMagenta: "#e9d5ff",
                cyan: "#a3e635",
                brightCyan: "#bef264",
                white: "#f8fafc",
                brightWhite: "#ffffff"
            }
        });

        const fitAddon = new FitAddon.FitAddon();
        term.loadAddon(fitAddon);
        term.open(document.getElementById('terminal'));

        const fit = () => {
            try { fitAddon.fit(); } catch (_) {}
        };
        fit();
        requestAnimationFrame(() => fit());
        setTimeout(fit, 100);
        term.focus();

        if (document.fonts) {
            document.fonts.ready.then(() => {
                fit();
                term.refresh(0, term.rows - 1);
            });
        }

        // ── Socket.IO ──
        const socket = io({ transports: ["websocket", "polling"] });

        socket.on('connect', () => {
            statusText.textContent = 'Authentification…';
            statusDot.className = 'status-dot';
            fit();
            socket.emit('join_session', {
                token,
                cols: term.cols || 100,
                rows: term.rows || 30
            });
        });

        socket.on('terminal_connected', ({ utilisateur, target, port } = {}) => {
            statusDot.className = 'status-dot connected';
            const userTarget = utilisateur && target ? `${utilisateur}@${target}:${port || 22}` : label;
            statusText.textContent = `Connecté : ${userTarget}`;
            sessionTitle.textContent = `${userTarget} — SSH`;
            document.title = `${userTarget} — CyBear SSH`;
            fit();
            socket.emit('terminal_resize', { cols: term.cols, rows: term.rows });
        });

        socket.on('terminal_output', ({ data } = {}) => {
            if (data) term.write(data);
        });

        socket.on('terminal_error', ({ message } = {}) => {
            statusDot.className = 'status-dot error';
            statusText.textContent = `Erreur : ${message || 'inconnue'}`;
            term.write(`\r\n\x1b[31m[Erreur] ${message || 'Échec de connexion'}\x1b[0m\r\n`);
        });

        socket.on('disconnect', () => {
            statusDot.className = 'status-dot error';
            statusText.textContent = 'Déconnecté';
            term.write('\r\n\x1b[33m[Connexion fermée]\x1b[0m\r\n');
        });

        // ── Saisie utilisateur → SSH ──
        term.onData((data) => {
            socket.emit('terminal_input', { data });
        });

        // ── Redimensionnement PTY ──
        term.onResize(({ cols, rows }) => {
            socket.emit('terminal_resize', { cols, rows });
        });

        window.addEventListener('resize', () => {
            fit();
            setTimeout(() => {
                socket.emit('terminal_resize', {
                    cols: term.cols,
                    rows: term.rows,
                });
            }, 50);
        });
    </script>
</body>
</html>
