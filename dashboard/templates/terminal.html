<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CyBear — Terminal SSH</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.css" />
    <style>
        :root {
            --bg: #ffffff;
            --bg-card: #ffffff;
            --border: #000000;
            --text: #000000;
            --text-muted: #4b5563;
            --main: #a3e635;
            --critique: #ef4444;
            --critique-bg: #fee2e2;
            --succes: #10b981;
            --succes-bg: #d1fae5;
            --accent: #2563eb;
            --accent-bg: #dbeafe;
            --terminal-bg: #000000;
            --terminal-text: #22c55e;
            --shadow: 4px 4px 0px #000000;
            --shadow-sm: 2px 2px 0px #000000;
            --grid: rgba(0, 0, 0, 0.08);
        }

        [data-theme="dark"] {
            --bg: #050510;
            --bg-card: #15151d;
            --border: #ffffff;
            --text: #f8fafc;
            --text-muted: #a1a1aa;
            --main: #a3e635;
            --critique: #f87171;
            --critique-bg: rgba(239, 68, 68, 0.18);
            --succes: #34d399;
            --succes-bg: rgba(16, 185, 129, 0.18);
            --accent: #60a5fa;
            --accent-bg: rgba(59, 130, 246, 0.18);
            --terminal-bg: #000000;
            --terminal-text: #22c55e;
            --shadow: 4px 4px 0px #ffffff;
            --shadow-sm: 2px 2px 0px #ffffff;
            --grid: rgba(255, 255, 255, 0.06);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }

        body {
            background-color: var(--bg);
            background-image: 
                linear-gradient(to right, var(--grid) 1px, transparent 1px),
                linear-gradient(to bottom, var(--grid) 1px, transparent 1px);
            background-size: 40px 40px;
            color: var(--text);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 18px;
            transition: background 0.3s ease, color 0.3s ease;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 22px;
            background: var(--bg-card);
            border: 3px solid var(--border);
            border-radius: 8px;
            box-shadow: var(--shadow);
            flex-wrap: wrap;
            gap: 12px;
        }

        .header-brand {
            display: flex;
            align-items: center;
            gap: 14px;
            flex-wrap: wrap;
        }

        .brand-title {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1.6rem;
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .brand-logo {
            display: flex;
            flex-direction: column;
            background: var(--main);
            color: #000000;
            padding: 6px 10px;
            border: 2px solid var(--border);
            border-radius: 6px;
            box-shadow: var(--shadow-sm);
            line-height: 0.9;
        }

        .brand-logo span {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1.1rem;
            font-weight: 800;
        }

        .brand-tag {
            font-size: 0.7rem;
            background: var(--succes-bg);
            color: var(--succes);
            padding: 4px 12px;
            border: 2px solid var(--border);
            border-radius: 6px;
            text-transform: uppercase;
            font-weight: 800;
            box-shadow: var(--shadow-sm);
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 8px 14px;
            border-radius: 6px;
            border: 2px solid var(--border);
            font-weight: 800;
            font-size: 0.85rem;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: var(--shadow-sm);
            text-transform: uppercase;
            background: var(--bg-card);
            color: var(--text);
        }

        .btn:hover {
            transform: translate(-2px, -2px);
            box-shadow: 4px 4px 0px var(--border);
        }

        .btn-accent {
            background: var(--accent-bg);
            color: var(--accent);
        }

        .btn-success {
            background: var(--succes-bg);
            color: var(--succes);
        }

        .btn-danger {
            background: var(--critique-bg);
            color: var(--critique);
        }

        .panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: var(--bg-card);
            border: 3px solid var(--border);
            border-radius: 8px;
            box-shadow: var(--shadow);
            overflow: hidden;
            min-height: 60vh;
        }

        .panel-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 18px;
            background: linear-gradient(90deg, rgba(163, 230, 53, 0.22) 0%, transparent 100%);
            border-bottom: 2px solid var(--border);
        }

        .panel-title {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 800;
            font-family: 'Space Grotesk', sans-serif;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .dots {
            display: flex;
            gap: 6px;
        }

        .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            border: 1px solid rgba(255,255,255,0.6);
        }

        .dot-red { background: #f87171; }
        .dot-yellow { background: #fbbf24; }
        .dot-green { background: #22c55e; }

        #terminal-container {
            flex: 1;
            background: var(--terminal-bg);
            padding: 12px;
        }

        #terminal {
            height: 100%;
            width: 100%;
        }

        .status-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 18px;
            border-top: 2px solid var(--border);
            background: var(--bg-card);
            font-size: 0.85rem;
            font-weight: 700;
        }

        .status-left {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .status-dot {
            width: 9px;
            height: 9px;
            border-radius: 50%;
            background: var(--succes);
            border: 1px solid var(--border);
            box-shadow: 0 0 0 4px rgba(16, 185, 129, 0.12);
        }

        footer {
            text-align: center;
            color: var(--text-muted);
            font-size: 0.9rem;
            font-weight: 700;
        }
    </style>
</head>
<body>
    <header>
        <div class="header-brand">
            <div class="brand-title">
                <div class="brand-logo">
                    <span>CyBear</span>
                    <span>TERM</span>
                </div>
                Terminal SSH Interactif
            </div>
            <span class="brand-tag">RevShell / Accès Cible</span>
        </div>
        <div class="header-actions">
            <a href="/" class="btn btn-accent">← SIEM</a>
            <a href="/attack" class="btn btn-danger">⚔️ Panneau d'Attaques</a>
            <button class="btn" id="theme-toggle">🌙 Thème</button>
        </div>
    </header>

    <section class="panel">
        <div class="panel-header">
            <div class="panel-title">
                <div class="dots">
                    <span class="dot dot-red"></span>
                    <span class="dot dot-yellow"></span>
                    <span class="dot dot-green"></span>
                </div>
                <span>cybear@kali ~ shell interactif</span>
            </div>
            <span style="color: var(--terminal-text); font-size: 0.8rem; font-weight: 700; font-family: 'JetBrains Mono', monospace;">xterm.js</span>
        </div>
        <div id="terminal-container">
            <div id="terminal"></div>
        </div>
        <div class="status-bar">
            <div class="status-left">
                <span class="status-dot"></span>
                <span id="status-text">Connexion en cours...</span>
            </div>
            <div>CyBear SIEM • Neobrutal Interface</div>
        </div>
    </section>

    <footer>Terminal SSH sécurisé — Projet NID-P-S</footer>

    <script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit@0.8.0/lib/xterm-addon-fit.js"></script>
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    <script>
        const themeToggle = document.getElementById('theme-toggle');
        const root = document.documentElement;
        const savedTheme = localStorage.getItem('cybear-theme') || 'light';
        root.setAttribute('data-theme', savedTheme);
        themeToggle.textContent = savedTheme === 'dark' ? '☀️ Thème' : '🌙 Thème';
        themeToggle.addEventListener('click', () => {
            const current = root.getAttribute('data-theme');
            const next = current === 'dark' ? 'light' : 'dark';
            root.setAttribute('data-theme', next);
            localStorage.setItem('cybear-theme', next);
            themeToggle.textContent = next === 'dark' ? '☀️ Thème' : '🌙 Thème';
        });

        const term = new Terminal({
            cursorBlink: true,
            fontFamily: 'JetBrains Mono, monospace',
            fontSize: 14,
            theme: {
                background: '#000000',
                foreground: '#22c55e',
                cursor: '#a3e635',
                selectionBackground: 'rgba(163, 230, 53, 0.3)'
            },
            rows: 30,
            cols: 120
        });
        const fitAddon = new FitAddon.FitAddon();
        term.loadAddon(fitAddon);
        term.open(document.getElementById('terminal'));
        fitAddon.fit();
        window.addEventListener('resize', () => fitAddon.fit());

        const socket = io();
        const statusText = document.getElementById('status-text');

        socket.on('connect', () => {
            statusText.textContent = 'Connecté — Initialisation session SSH';
            socket.emit('terminal_start', {});
        });

        socket.on('terminal_output', (data) => {
            term.write(data.output || '');
        });

        socket.on('terminal_connected', () => {
            statusText.textContent = 'Session SSH active';
        });

        socket.on('terminal_error', (data) => {
            statusText.textContent = 'Erreur: ' + (data.message || 'inconnue');
            term.write('\r\n\x1b[31m[ERREUR] ' + (data.message || '') + '\x1b[0m\r\n');
        });

        socket.on('disconnect', () => {
            statusText.textContent = 'Déconnecté';
        });

        term.onData((data) => {
            socket.emit('terminal_input', { input: data });
        });
    </script>
</body>
</html>
