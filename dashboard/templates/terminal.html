<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SSH Terminal — CyBear</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.css" />
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: #0f172a;
            color: #f1f5f9;
            font-family: "JetBrains Mono", "Fira Code", "Cascadia Code", monospace;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* ── Barre supérieure ── */
        #header {
            flex-shrink: 0;
            background: #1e293b;
            border-bottom: 1px solid #334155;
            padding: 6px 14px;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.8rem;
            color: #94a3b8;
            user-select: none;
        }

        #header .dot-row { display: flex; gap: 6px; align-items: center; }
        .window-dot {
            width: 12px; height: 12px;
            border-radius: 50%;
        }
        .dot-red    { background: #ef4444; }
        .dot-yellow { background: #fbbf24; }
        .dot-green  { background: #34d399; }

        #status-dot {
            width: 8px; height: 8px;
            border-radius: 50%;
            background: #fbbf24;
            transition: background 0.3s;
        }
        #status-dot.connected { background: #34d399; box-shadow: 0 0 6px #34d399; }
        #status-dot.error     { background: #ef4444; }

        #target-label { color: #34d399; font-weight: 700; }
        #status-text  { color: #64748b; font-size: 0.75rem; }

        /* ── Terminal ── */
        #terminal-wrapper {
            flex: 1;
            overflow: hidden;
            padding: 6px 6px 0 6px;
        }

        .xterm { height: 100% !important; }
        .xterm-viewport { overflow-y: hidden !important; }
        .xterm-screen { height: 100% !important; }
    </style>
</head>
<body>
    <div id="header">
        <div class="dot-row">
            <div class="window-dot dot-red"    onclick="window.close()"></div>
            <div class="window-dot dot-yellow"></div>
            <div class="window-dot dot-green"></div>
        </div>
        <div id="status-dot"></div>
        <span>SSH — <strong id="target-label">…</strong></span>
        <span id="status-text">Connexion en cours…</span>
    </div>

    <div id="terminal-wrapper">
        <div id="terminal-container" style="width:100%;height:100%;"></div>
    </div>

    <!-- xterm.js 5.3 -->
    <script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit@0.8.0/lib/xterm-addon-fit.js"></script>
    <!-- Socket.IO 4.7 -->
    <script src="https://cdn.jsdelivr.net/npm/socket.io-client@4.7.2/dist/socket.io.min.js"></script>

    <script>
    (() => {
        // ── Paramètres URL ────────────────────────────────────────────
        const params   = new URLSearchParams(window.location.search);
        const token    = params.get("token") || "";
        const label    = params.get("label") || "SSH";

        document.getElementById("target-label").textContent = label;

        // ── Terminal xterm.js ─────────────────────────────────────────
        const term = new Terminal({
            cursorBlink  : true,
            scrollback   : 10000,
            fontFamily   : '"JetBrains Mono", "Fira Code", monospace',
            fontSize     : 14,
            lineHeight   : 1.2,
            theme: {
                background    : "#0f172a",
                foreground    : "#f1f5f9",
                cursor        : "#34d399",
                cursorAccent  : "#0f172a",
                selectionBackground: "rgba(52,211,153,0.3)",
                black         : "#0f172a",   brightBlack   : "#475569",
                red           : "#ef4444",   brightRed     : "#f87171",
                green         : "#34d399",   brightGreen   : "#6ee7b7",
                yellow        : "#fbbf24",   brightYellow  : "#fcd34d",
                blue          : "#60a5fa",   brightBlue    : "#93c5fd",
                magenta       : "#c084fc",   brightMagenta : "#d8b4fe",
                cyan          : "#22d3ee",   brightCyan    : "#67e8f9",
                white         : "#e2e8f0",   brightWhite   : "#ffffff",
            },
        });

        const fitAddon = new FitAddon.FitAddon();
        term.loadAddon(fitAddon);
        term.open(document.getElementById("terminal-container"));

        const fit = () => {
            try { fitAddon.fit(); } catch (_) {}
        };
        fit();
        document.fonts.ready.then(fit);

        // ── Socket.IO ─────────────────────────────────────────────────
        const socket = io({ transports: ["websocket", "polling"] });

        const statusDot  = document.getElementById("status-dot");
        const statusText = document.getElementById("status-text");

        socket.on("connect", () => {
            statusText.textContent = "Authentification…";
            socket.emit("join_session", { token });
        });

        socket.on("terminal_connected", ({ utilisateur, target, port }) => {
            statusDot.className = "connected";
            statusText.textContent = `${utilisateur}@${target}:${port}`;
            document.title = `${utilisateur}@${target} — CyBear SSH`;
        });

        socket.on("terminal_output", ({ data }) => {
            term.write(data);
        });

        socket.on("terminal_error", ({ message }) => {
            statusDot.className = "error";
            statusText.textContent = `Erreur : ${message}`;
        });

        socket.on("disconnect", () => {
            statusDot.className = "error";
            statusText.textContent = "Déconnecté";
            term.write("\r\n\x1b[33m[Connexion fermée]\x1b[0m\r\n");
        });

        // ── Saisie utilisateur → SSH ──────────────────────────────────
        term.onData((data) => socket.emit("terminal_input", { data }));

        // ── Redimensionnement PTY ─────────────────────────────────────
        term.onResize(({ cols, rows }) => {
            socket.emit("terminal_resize", { cols, rows });
        });

        window.addEventListener("resize", () => {
            fit();
            // Émet la nouvelle taille après fit
            setTimeout(() => {
                socket.emit("terminal_resize", {
                    cols: term.cols,
                    rows: term.rows,
                });
            }, 50);
        });
    })();
    </script>
</body>
</html>
